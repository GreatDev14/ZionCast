<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ZionCast - Live Projector / TV Output</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Display-specific full screen overrides */
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      cursor: default;
    }
  </style>
</head>
<body class="display-root">

  <!-- 1. Procedural Motion Background Layer (Canvas) -->
  <canvas id="display-canvas" class="display-bg-canvas"></canvas>

  <!-- 2. Hardware Direct Camera Layer (DroidCam / OBS / Preacher) -->
  <video id="display-camera-layer" class="display-camera-layer" autoplay playsinline muted></video>

  <!-- 3. Local Custom Video & Image Backgrounds -->
  <video id="display-video-bg" class="display-media-bg" autoplay loop muted playsinline></video>
  <img id="display-img-bg" class="display-media-bg" alt="Custom background">

  <!-- 3b. YouTube Live & Video Stream Layer -->
  <div id="display-youtube-layer" class="display-youtube-layer">
    <iframe id="display-youtube-iframe" src="" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay *; clipboard-write; encrypted-media *; gyroscope; picture-in-picture; web-share; fullscreen *" allowfullscreen></iframe>
  </div>

  <!-- 4. Contrast Scrim Layer (Protects Lyric Legibility) -->
  <div id="display-scrim" class="display-scrim-layer"></div>

  <!-- 5. Slide Lyrics / Scripture Text Container -->
  <div id="display-text-container" class="display-text-wrapper">
    <div id="display-badge" class="display-title-badge"></div>
    <div id="display-body" class="display-body-text"></div>
  </div>

  <!-- 5b. Live Sanctuary Clock Overlay for Entire Congregation (Top-Right of Church TV) -->
  <div id="display-sanctuary-clock" class="display-sanctuary-clock">
    <span class="clock-icon">🕒</span>
    <span id="display-clock-text">--:--</span>
  </div>

  <!-- 5c. Pre-Service Countdown Timer Overlay Layer -->
  <div id="display-countdown-layer" class="display-countdown-wrapper">
    <div class="display-countdown-card">
      <div id="display-countdown-title" class="display-countdown-title">SERVICE BEGINS IN</div>
      <div id="display-countdown-digits" class="display-countdown-digits">05:00</div>
      <div id="display-countdown-sub" class="display-countdown-sub">Welcome to Worship • Please be seated</div>
    </div>
  </div>

  <!-- 6. Nursery / Congregation Alert Ticker Banner -->
  <div id="display-ticker" class="display-ticker-banner"></div>

  <!-- 7. Hardware-Composited Dimmer Curtain (Master Brightness 0-100%) -->
  <div id="display-dimmer" class="display-dimmer-layer"></div>

  <!-- 8. Instant Blackout Curtain (Pure Black Fade) -->
  <div id="display-blackout" class="display-blackout-curtain"></div>

  <script src="display.js"></script>
</body>
</html>
